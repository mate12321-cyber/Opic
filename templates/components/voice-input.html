<div class="input-wrap">
  <textarea id="{{id}}" placeholder="{{placeholder}}"></textarea>
  <button class="mic-btn" id="{{micId}}" type="button" title="음성으로 입력">
    🎤
  </button>
</div>
<div class="mic-error" id="{{micErrorId}}"></div>
<div class="live-translate" id="{{translateId}}">
  <span class="lt-label">→ 실시간 번역</span>
  <span class="lt-text" id="{{translateTextId}}"></span>
</div>
<div class="input-actions">
  <button class="copy-btn" id="{{copyId}}" title="{{copyTitle}}">
    {{copyText}}
  </button>
</div>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>한→영 문장 변환 연습 · IM1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Noto+Serif+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EBEEE9;
    --card:#FFFDF9;
    --ink:#232C3B;
    --ink-soft:#5B6472;
    --margin-rose:#B85C52;
    --teal:#3E7C74;
    --teal-deep:#2C5952;
    --gold:#AD8A2E;
    --brick:#A24B3D;
    --line:#DAD9CE;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:
      repeating-linear-gradient(transparent, transparent 37px, var(--line) 38px),
      var(--paper);
    font-family:'IBM Plex Sans KR', sans-serif;
    color:var(--ink);
    display:flex;
    justify-content:center;
    padding:28px 14px 60px;
  }
  .wrap{ width:100%; max-width:560px; }

  header{ margin-bottom:18px; }
  .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:.14em;
    color:var(--teal-deep);
    text-transform:uppercase;
  }
  h1{
    font-family:'Noto Serif KR', serif;
    font-weight:600;
    font-size:22px;
    margin:4px 0 0;
    color:var(--ink);
  }
  .sub{
    font-size:13px;
    color:var(--ink-soft);
    margin-top:6px;
    line-height:1.5;
  }

  .card{
    position:relative;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:6px;
    box-shadow:0 1px 2px rgba(35,44,59,.04), 0 8px 24px rgba(35,44,59,.06);
    padding:26px 22px 22px 34px;
    overflow:hidden;
  }
  .card::before{
    content:'';
    position:absolute;
    left:22px; top:0; bottom:0;
    width:1px;
    background:var(--margin-rose);
    opacity:.55;
  }
  .card::after{
    content:'';
    position:absolute;
    right:16px; top:16px;
    width:34px; height:34px;
    border:1.5px solid var(--margin-rose);
    border-radius:50%;
    opacity:.5;
  }

  .cardtop{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    margin-bottom:18px;
  }
  .cat{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:.08em;
    color:var(--teal-deep);
    background:rgba(62,124,116,.1);
    border:1px solid rgba(62,124,116,.3);
    border-radius:2px;
    padding:3px 8px;
    display:inline-block;
    transform:rotate(-1deg);
  }
  .idx{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color:var(--ink-soft);
  }

  .ko{
    font-family:'Noto Serif KR', serif;
    font-size:21px;
    font-weight:500;
    line-height:1.6;
    color:var(--ink);
    margin:0;
  }

  .line-row{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:10px;
    margin-bottom:20px;
  }
  .lbl-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:6px;
  }
  .lbl-row .lbl{ margin-bottom:0; }

  .copy-btn{
    flex-shrink:0;
    font-family:'IBM Plex Mono', monospace;
    font-size:10.5px;
    letter-spacing:.04em;
    color:var(--teal-deep);
    background:rgba(62,124,116,.08);
    border:1px solid rgba(62,124,116,.35);
    border-radius:20px;
    padding:5px 10px;
    cursor:pointer;
    white-space:nowrap;
  }
  .copy-btn:active{ opacity:.7; }
  .copy-btn.copied{
    background:var(--teal-deep);
    border-color:var(--teal-deep);
    color:#F6F5EF;
  }
  .input-actions{
    display:flex;
    justify-content:flex-end;
    margin-top:6px;
  }
  .live-translate{
    display:none;
    margin-top:8px;
    padding:9px 11px;
    background:rgba(62,124,116,.06);
    border-left:2px solid var(--teal);
    border-radius:2px;
    font-size:13px;
    line-height:1.5;
  }
  .live-translate.show{ display:block; }
  .lt-label{
    font-family:'IBM Plex Mono', monospace;
    font-size:10px;
    letter-spacing:.05em;
    color:var(--teal-deep);
    margin-right:6px;
  }
  .lt-text{
    font-family:'Noto Serif KR', serif;
    color:var(--ink-soft);
  }
  .lt-text.loading{ opacity:.55; }

  .grammar{
    display:none;
    margin-top:16px;
    padding-top:14px;
    border-top:1px dashed var(--line);
  }
  .grammar.show{ display:block; }
  .g-good{
    font-size:13.5px;
    color:var(--teal-deep);
    background:rgba(62,124,116,.08);
    border:1px solid rgba(62,124,116,.3);
    border-radius:4px;
    padding:9px 11px;
  }
  .g-note{
    font-size:12.5px;
    color:var(--ink-soft);
  }
  .g-item{
    background:rgba(162,75,61,.06);
    border-left:2px solid var(--brick);
    border-radius:2px;
    padding:9px 11px;
    margin-bottom:8px;
    font-size:13px;
  }
  .g-item:last-child{ margin-bottom:0; }
  .g-excerpt{
    font-family:'Newsreader', serif;
    font-style:italic;
    color:var(--ink);
    margin-bottom:5px;
  }
  .g-excerpt u{ color:var(--brick); text-decoration-color:var(--brick); }
  .g-msg{
    color:var(--ink-soft);
    font-size:12px;
    line-height:1.5;
  }
  .g-fix{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    color:var(--teal-deep);
    margin-top:4px;
  }
  .google-ask-row{
    display:flex;
    gap:8px;
    margin-top:12px;
  }
  .google-ask-row .copy-btn{
    text-decoration:none;
    display:inline-block;
  }

  textarea{
    width:100%;
    min-height:76px;
    resize:vertical;
    font-family:'Newsreader', serif;
    font-size:17px;
    font-style:italic;
    color:var(--ink);
    border:none;
    border-bottom:1px solid var(--line);
    background:transparent;
    padding:2px 34px 10px 2px;
    outline:none;
  }
  textarea:focus{ border-bottom-color:var(--teal); }
  textarea::placeholder{ color:#B7BCC4; font-style:italic; }

  .input-wrap{ position:relative; }
  .mic-btn{
    position:absolute;
    right:0;
    top:2px;
    width:28px;
    height:28px;
    border-radius:50%;
    border:1px solid var(--line);
    background:var(--card);
    font-size:14px;
    line-height:1;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    padding:0;
  }
  .mic-btn.listening{
    background:var(--brick);
    border-color:var(--brick);
    color:#fff;
    animation:pulse 1.2s infinite;
  }
  @keyframes pulse{
    0%{ box-shadow:0 0 0 0 rgba(162,75,61,.4); }
    70%{ box-shadow:0 0 0 8px rgba(162,75,61,0); }
    100%{ box-shadow:0 0 0 0 rgba(162,75,61,0); }
  }
  .mic-error{
    display:none;
    font-size:11.5px;
    color:var(--brick);
    margin-top:6px;
    line-height:1.5;
  }
  .mic-error.show{ display:block; }

  .answer{
    margin-top:18px;
    padding-top:16px;
    border-top:1px dashed var(--line);
    display:none;
  }
  .answer.show{ display:block; }
  .answer .lbl{
    font-family:'IBM Plex Mono', monospace;
    font-size:10.5px;
    letter-spacing:.1em;
    color:var(--margin-rose);
    text-transform:uppercase;
    margin-bottom:6px;
  }
  .en{
    font-family:'Newsreader', serif;
    font-size:19px;
    font-style:italic;
    color:var(--teal-deep);
    line-height:1.5;
    margin:0 0 8px;
  }
  .tip{
    font-size:12.5px;
    color:var(--ink-soft);
    line-height:1.55;
  }

  .row{ display:flex; gap:10px; margin-top:20px; }
  button{
    font-family:'IBM Plex Mono', monospace;
    font-size:12.5px;
    letter-spacing:.03em;
    border-radius:3px;
    padding:11px 14px;
    cursor:pointer;
    border:1px solid transparent;
    transition:opacity .15s;
  }
  button:active{ opacity:.75; }
  .primary{
    flex:1;
    background:var(--teal-deep);
    color:#F6F5EF;
    border:none;
  }
  .ghost{
    flex:1;
    background:transparent;
    border:1px solid var(--line);
    color:var(--ink-soft);
  }
  .good{
    flex:1;
    background:rgba(173,138,46,.12);
    border:1px solid rgba(173,138,46,.5);
    color:var(--gold);
  }
  .bad{
    flex:1;
    background:rgba(162,75,61,.1);
    border:1px solid rgba(162,75,61,.45);
    color:var(--brick);
  }

  .progress{
    display:flex;
    gap:4px;
    margin-top:16px;
    flex-wrap:wrap;
  }
  .dot{
    width:7px; height:7px; border-radius:50%;
    background:var(--line);
  }
  .dot.done{ background:var(--teal); }
  .dot.miss{ background:var(--brick); opacity:.6; }
  .dot.cur{ outline:2px solid var(--margin-rose); outline-offset:2px; }

  .done-screen{ text-align:center; padding:40px 10px; display:none; }
  .done-screen.show{ display:block; }
  .done-screen h2{ font-family:'Noto Serif KR',serif; font-size:20px; margin-bottom:8px; }
  .done-screen p{ color:var(--ink-soft); font-size:13px; margin-bottom:20px; }

  .topic-screen{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:6px;
    padding:22px 20px;
    box-shadow:0 1px 2px rgba(35,44,59,.04), 0 8px 24px rgba(35,44,59,.06);
  }
  .topic-lbl{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    letter-spacing:.08em;
    color:var(--ink-soft);
    text-transform:uppercase;
    margin-bottom:14px;
  }
  .topic-lbl span{ color:var(--teal-deep); text-transform:none; letter-spacing:normal; }
  .chips{ display:flex; flex-wrap:wrap; gap:8px; }
  .group{ margin-top:18px; }
  .group:first-of-type{ margin-top:16px; }
  .group-head{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin-bottom:8px;
  }
  .group-head span:first-child{
    font-family:'Noto Serif KR', serif;
    font-size:13.5px;
    font-weight:600;
    color:var(--ink);
  }
  .group-toggle{
    font-family:'IBM Plex Mono', monospace;
    font-size:10.5px;
    color:var(--teal-deep);
    text-decoration:underline;
    cursor:pointer;
  }
  .chip{
    font-family:'IBM Plex Sans KR', sans-serif;
    font-size:13px;
    padding:8px 13px;
    border-radius:20px;
    border:1px solid var(--line);
    background:transparent;
    color:var(--ink-soft);
    cursor:pointer;
    user-select:none;
  }
  .chip.all{
    border-color:var(--teal);
    color:var(--teal-deep);
    font-family:'IBM Plex Mono', monospace;
    letter-spacing:.02em;
  }
  .chip.active{
    background:var(--teal-deep);
    border-color:var(--teal-deep);
    color:#F6F5EF;
  }
  .change-topic{
    margin-top:14px;
    text-align:center;
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:.05em;
    color:var(--ink-soft);
    text-decoration:underline;
    cursor:pointer;
  }

  .mode-switch{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:.05em;
    color:var(--teal-deep);
    text-decoration:underline;
    cursor:pointer;
  }

  #wordSentence{
    margin-bottom:20px;
  }
  .word-options{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .word-opt{
    font-family:'Newsreader', serif;
    font-size:16px;
    text-align:left;
    padding:11px 14px;
    border-radius:4px;
    border:1px solid var(--line);
    background:var(--card);
    color:var(--ink);
    cursor:pointer;
  }
  .word-opt:active{ opacity:.8; }
  .word-opt.correct{
    background:rgba(173,138,46,.14);
    border-color:var(--gold);
    color:var(--gold);
    font-weight:600;
  }
  .word-opt.wrong{
    background:rgba(162,75,61,.1);
    border-color:var(--brick);
    color:var(--brick);
  }
  .word-opt.disabled{ pointer-events:none; }
  .word-explain{
    display:none;
    margin-top:14px;
    padding:10px 12px;
    background:rgba(62,124,116,.06);
    border-left:2px solid var(--teal);
    border-radius:2px;
    font-size:13px;
    color:var(--ink-soft);
    line-height:1.55;
  }
  .word-explain.show{ display:block; }

  .mode-switch-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:16px;
  }
  .change-topic-row{
    display:flex;
    justify-content:center;
    gap:16px;
    margin-top:14px;
  }
  .change-topic-row .change-topic{ margin-top:0; }

  .home-screen{
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  .home-header{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
  }
  .home-eyebrow{
    font-family:'Noto Serif KR', serif;
    font-weight:600;
    font-size:19px;
    color:var(--ink);
  }
  .home-date{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color:var(--ink-soft);
  }
  .home-stats{
    display:flex;
    gap:10px;
  }
  .home-stat{
    flex:1;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:6px;
    padding:10px 8px;
    text-align:center;
  }
  .home-stat .n{
    display:block;
    font-family:'IBM Plex Mono', monospace;
    font-size:20px;
    font-weight:600;
    color:var(--teal-deep);
  }
  .home-stat .l{
    font-size:11px;
    color:var(--ink-soft);
  }
  .home-chart{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:6px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:6px;
    padding:12px 12px 10px;
    height:76px;
  }
  .home-chart .bar-col{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-end;
    height:100%;
    gap:4px;
  }
  .home-chart .bar{
    width:100%;
    max-width:22px;
    background:var(--teal);
    border-radius:3px 3px 1px 1px;
    min-height:3px;
  }
  .home-chart .bar.today{ background:var(--margin-rose); }
  .home-chart .bar-label{
    font-family:'IBM Plex Mono', monospace;
    font-size:9.5px;
    color:var(--ink-soft);
  }
  .home-nav{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .nav-card{
    display:flex;
    align-items:center;
    gap:12px;
    width:100%;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:8px;
    padding:14px;
    cursor:pointer;
    text-align:left;
    font-family:inherit;
  }
  .nav-card:active{ opacity:.8; }
  .nav-card-icon{ font-size:24px; flex-shrink:0; }
  .nav-card-body{
    flex:1;
    display:flex;
    flex-direction:column;
    gap:2px;
    min-width:0;
  }
  .nav-card-title{
    font-family:'Noto Serif KR', serif;
    font-weight:600;
    font-size:15px;
    color:var(--ink);
  }
  .nav-card-sub{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color:var(--ink-soft);
  }
  .nav-card-arrow{
    font-size:20px;
    color:var(--line);
    flex-shrink:0;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="home-screen" id="homeScreen">
    <div class="home-header">
      <div class="home-eyebrow">OPIc IM1 연습</div>
      <div class="home-date" id="homeDate"></div>
    </div>

    <div class="home-stats">
      <div class="home-stat"><span class="n" id="statToday">0</span><span class="l">오늘</span></div>
      <div class="home-stat"><span class="n" id="statWeek">0</span><span class="l">이번 주</span></div>
      <div class="home-stat"><span class="n" id="statStreak">0</span><span class="l">연속일</span></div>
    </div>

    <div class="home-chart" id="homeChart"></div>

    <div class="home-nav">
      <button class="nav-card" id="navSentence">
        <span class="nav-card-icon">📝</span>
        <span class="nav-card-body">
          <span class="nav-card-title">문장 번역 연습</span>
          <span class="nav-card-sub" id="navSentenceSub"></span>
        </span>
        <span class="nav-card-arrow">›</span>
      </button>
      <button class="nav-card" id="navWord">
        <span class="nav-card-icon">🔤</span>
        <span class="nav-card-body">
          <span class="nav-card-title">문법 포인트 연습</span>
          <span class="nav-card-sub" id="navWordSub"></span>
        </span>
        <span class="nav-card-arrow">›</span>
      </button>
    </div>
  </div>

  <div class="topic-screen" id="topicScreen" style="display:none;">
    <div class="mode-switch-row">
      <span class="mode-switch" id="homeFromTopic">🏠 홈</span>
      <span class="mode-switch" id="toWordModeLink">문법 포인트 연습 →</span>
    </div>
    <div class="topic-lbl">주제 선택 <span id="topicCount"></span></div>
    <div class="chips" id="topicChips"></div>
    <button class="primary" id="startBtn" style="width:100%; margin-top:18px;">이 주제로 시작하기</button>
  </div>

  <div class="card" id="practiceCard" style="display:none;">
    <div class="cardtop">
      <span class="cat" id="catLabel">CATEGORY</span>
      <span class="idx" id="idxLabel">01 / 00</span>
    </div>
    <div class="line-row">
      <p class="ko" id="koText"></p>
      <button class="copy-btn" id="copyKo" title="문제 복사">복사</button>
    </div>

    <div class="input-wrap">
      <textarea id="userInput" placeholder="여기에 영어로 답을 적어보세요 (선택 사항)"></textarea>
      <button class="mic-btn" id="micBtn" type="button" title="음성으로 입력">🎤</button>
    </div>
    <div class="mic-error" id="micError"></div>
    <div class="live-translate" id="liveTranslate">
      <span class="lt-label">→ 실시간 번역</span>
      <span class="lt-text" id="liveTranslateText"></span>
    </div>
    <div class="input-actions">
      <button class="copy-btn" id="copyInput" title="내 답 복사">내 답 복사</button>
    </div>

    <div class="answer" id="answerBox">
      <div class="lbl-row">
        <div class="lbl">모범 답안</div>
        <button class="copy-btn" id="copyEn" title="모범 답안 복사">복사</button>
      </div>
      <p class="en" id="enText"></p>
      <div class="tip" id="tipText"></div>

      <div class="grammar" id="grammarBox">
        <div class="lbl">내 답 문법 분석</div>
        <div id="grammarContent"></div>
        <div class="google-ask-row">
          <a class="copy-btn" id="googleAskLink" href="#" target="_blank" rel="noopener">Google AI 모드로 확인</a>
          <button class="copy-btn" id="googleAskCopy" type="button">질문 복사</button>
        </div>
      </div>
    </div>

    <div class="row" id="revealRow">
      <button class="primary" id="revealBtn">정답 확인</button>
      <button class="ghost" id="skipBtn">건너뛰기</button>
    </div>
    <div class="row" id="rateRow" style="display:none;">
      <button class="good" id="goodBtn">잘했어요 ✓</button>
      <button class="bad" id="badBtn">다시 연습 ✗</button>
    </div>
    <div class="change-topic" id="retrySameLink" style="display:none;">이 문제 바로 다시 풀기</div>

    <div class="progress" id="progressDots"></div>
    <div class="change-topic-row">
      <span class="change-topic" id="homeFromPractice">🏠 홈</span>
      <span class="change-topic" id="changeTopicBtn">주제 변경</span>
    </div>
  </div>

  <div class="done-screen" id="doneScreen">
    <h2>오늘 세트 완료!</h2>

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1; i>0; i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function renderChips(){
  els.topicChips.innerHTML = '';

  const allBtn = document.createElement('div');
  allBtn.className = 'chip all' + (selectedCats.size === CATEGORIES.length ? ' active' : '');
  allBtn.textContent = '전체';
  allBtn.onclick = () => {
    selectedCats = selectedCats.size === CATEGORIES.length ? new Set() : new Set(CATEGORIES);
    renderChips();
  };
  els.topicChips.appendChild(allBtn);

  Object.entries(GROUPS).forEach(([groupName, cats])=>{
    const groupWrap = document.createElement('div');
    groupWrap.className = 'group';

    const groupHead = document.createElement('div');
    groupHead.className = 'group-head';
    const allInGroup = cats.every(c=>selectedCats.has(c));
    groupHead.innerHTML = `<span>${groupName}</span>`;
    const groupToggle = document.createElement('span');
    groupToggle.className = 'group-toggle';
    groupToggle.textContent = allInGroup ? '선택 해제' : '전체 선택';
    groupToggle.onclick = () => {
      if(allInGroup){ cats.forEach(c=>selectedCats.delete(c)); }
      else { cats.forEach(c=>selectedCats.add(c)); }
      renderChips();
    };
    groupHead.appendChild(groupToggle);
    groupWrap.appendChild(groupHead);

    const chipRow = document.createElement('div');
    chipRow.className = 'chips';
    cats.forEach(cat=>{
      const chip = document.createElement('div');
      chip.className = 'chip' + (selectedCats.has(cat) ? ' active' : '');
      chip.textContent = cat;
      chip.onclick = () => {
        if(selectedCats.has(cat)) selectedCats.delete(cat);
        else selectedCats.add(cat);
        renderChips();
      };
      chipRow.appendChild(chip);
    });
    groupWrap.appendChild(chipRow);
    els.topicChips.appendChild(groupWrap);
  });

  const count = SENTENCES.filter(s=>selectedCats.has(s.cat)).length;
  els.topicCount.textContent = selectedCats.size ? `(${count}문장)` : '(주제를 선택하세요)';
  els.startBtn.disabled = selectedCats.size === 0;
  els.startBtn.style.opacity = selectedCats.size === 0 ? '.45' : '1';
  els.startBtn.style.cursor = selectedCats.size === 0 ? 'not-allowed' : 'pointer';
}

function showTopicScreen(){
  hideAllScreens();
  els.topicScreen.style.display = 'block';
  renderChips();
}

function startPractice(){
  if(selectedCats.size === 0) return;
  order = shuffle(SENTENCES.map((_,i)=>i).filter(i=>selectedCats.has(SENTENCES[i].cat)));
  cur = 0;
  els.topicScreen.style.display = 'none';
  els.practiceCard.style.display = 'block';
  saveProgress();
  renderCard();
}

function copyText(text, btn){
  if(!text) return;
  const done = () => {
    const original = btn.textContent;
    btn.textContent = '복사됨!';
    btn.classList.add('copied');
    setTimeout(()=>{
      btn.textContent = original;
      btn.classList.remove('copied');
    }, 1200);
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(()=>fallbackCopy(text, done));
  } else {
    fallbackCopy(text, done);
  }
}

function fallbackCopy(text, cb){
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try{ document.execCommand('copy'); }catch(e){ /* ignore */ }
  document.body.removeChild(ta);
  cb();
}

let translateTimer = null;
let translateSeq = 0;

async function runLiveTranslate(text){
  const seq = ++translateSeq;
  if(!text.trim()){
    els.liveTranslate.classList.remove('show');
    return;
  }
  els.liveTranslate.classList.add('show');
  els.liveTranslateText.textContent = '번역 중...';
  els.liveTranslateText.classList.add('loading');
  try{
    const res = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=en|ko`);
    const data = await res.json();
    if(seq !== translateSeq) return; // stale response, a newer request superseded this one
    const translated = data && data.responseData && data.responseData.translatedText;
    els.liveTranslateText.textContent = translated || '번역을 불러올 수 없어요.';
  }catch(e){
    if(seq !== translateSeq) return;
    els.liveTranslateText.textContent = '번역을 불러올 수 없어요.';
  }finally{
    if(seq === translateSeq) els.liveTranslateText.classList.remove('loading');
  }
}

els.userInput.addEventListener('input', ()=>{
  clearTimeout(translateTimer);
  const text = els.userInput.value;
  if(!text.trim()){
    els.liveTranslate.classList.remove('show');
    return;
  }
  translateTimer = setTimeout(()=> runLiveTranslate(text), 700);
});

let recognition = null;
let listening = false;
let micStartTimer = null;
let micStarted = false;
let finalTranscript = '';

const MIC_ERROR_MESSAGES = {
  'not-allowed': '마이크 권한이 필요해요. 브라우저 주소창의 🔒 아이콘 → 마이크 → 허용으로 설정해주세요.',
  'permission-denied': '마이크 권한이 필요해요. 브라우저 주소창의 🔒 아이콘 → 마이크 → 허용으로 설정해주세요.',
  'service-not-allowed': '이 브라우저는 음성 인식 서비스를 지원하지 않아요. Chrome 브라우저에서 시도해보세요.',
  'audio-capture': '마이크를 찾을 수 없어요. 기기의 마이크 연결을 확인해주세요.',
  'network': '네트워크 문제로 음성 인식에 실패했어요.',
};

function showMicError(msg){
  els.micError.textContent = msg;
  els.micError.classList.add('show');
}

function clearMicError(){
  els.micError.classList.remove('show');
  els.micError.textContent = '';
}

function stopListeningUI(){
  listening = false;
  micStarted = false;
  clearTimeout(micStartTimer);
  els.micBtn.classList.remove('listening');
  els.micBtn.textContent = '🎤';
}

function armStartupWatchdog(){
  // Some browsers (e.g. Samsung Internet) accept .start() without error
  // but never actually begin listening. If onstart hasn't fired shortly
  // after, treat it as unsupported rather than leaving the UI stuck.
  micStartTimer = setTimeout(()=>{
    if(listening && !micStarted){
      try{ recognition.stop(); }catch(err){ /* ignore */ }
      stopListeningUI();
      showMicError('이 브라우저에서는 음성 인식이 지원되지 않아요. Chrome 브라우저에서 시도해보세요.');
    }
  }, 2500);
}

function initSpeechRecognition(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){
    els.micBtn.style.display = 'none';
    return;
  }
  recognition = new SR();
  recognition.lang = 'en-US';
  recognition.interimResults = true;
  recognition.continuous = true;

  recognition.onstart = ()=>{
    micStarted = true;
    clearTimeout(micStartTimer);
  };
  recognition.onresult = (e)=>{
    let interim = '';
    for(let i = e.resultIndex; i < e.results.length; i++){
      if(e.results[i].isFinal) finalTranscript += e.results[i][0].transcript + ' ';
      else interim += e.results[i][0].transcript;
    }
    els.userInput.value = (finalTranscript + interim).trim();
    els.userInput.dispatchEvent(new Event('input'));
  };
  recognition.onend = ()=>{
    // Continuous mode can still end early (e.g. after a pause). If the
    // user hasn't pressed stop, seamlessly restart instead of dropping
    // the session — mirrors the retry behavior from the previous OPIc app.
    if(listening){
      try{ recognition.start(); return; }
      catch(e){ /* fall through to stopping the UI below */ }
    }
    stopListeningUI();
  };
  recognition.onerror = (e)=>{
    // Transient hiccups — ignore and let continuous mode keep going.
    if(e.error === 'no-speech' || e.error === 'aborted') return;

    if(e.error === 'network' && listening){
      // Rebuild the engine and retry shortly, rather than giving up —
      // network blips during continuous listening are usually temporary.
      recognition.onend = null;
      try{ recognition.stop(); }catch(err){ /* ignore */ }
      initSpeechRecognition();
      setTimeout(()=>{
        if(!listening) return;
        try{
          recognition.start();
          armStartupWatchdog();
        }catch(err){
          stopListeningUI();
          showMicError(MIC_ERROR_MESSAGES.network);
        }
      }, 800);
      return;
    }

    stopListeningUI();
    showMicError(MIC_ERROR_MESSAGES[e.error] || '이 브라우저에서는 음성 인식이 지원되지 않아요. Chrome 브라우저에서 시도해보세요.');
  };
}

els.micBtn.addEventListener('click', async ()=>{
  if(!recognition) return;
  if(listening){
    recognition.onend = null; // don't auto-restart when the user explicitly stops
    recognition.stop();
    initSpeechRecognition(); // rebind handlers on a fresh instance for next time
    stopListeningUI();
    return;
  }
  clearMicError();

  if(navigator.mediaDevices && navigator.mediaDevices.getUserMedia){
    try{
      const stream = await navigator.mediaDevices.getUserMedia({audio: true});
      stream.getTracks().forEach(track => track.stop());
    }catch(e){
      showMicError('마이크 권한이 꺼져 있어요. 브라우저 설정에서 마이크 권한을 허용해주세요.');
      return;
    }
  }

  finalTranscript = els.userInput.value ? els.userInput.value + ' ' : '';
  try{
    recognition.start();
    listening = true;
    els.micBtn.classList.add('listening');
    els.micBtn.textContent = '⏹';
    armStartupWatchdog();
  }catch(e){
    stopListeningUI();
    showMicError('이 브라우저에서는 음성 인식이 지원되지 않아요. Chrome 브라우저에서 시도해보세요.');
  }
});

    els.progressDots.appendChild(d);
  });
}

function renderCard(){
  if(cur >= order.length){
    els.practiceCard.style.display = 'none';
    els.doneScreen.classList.add('show');
    const good = order.filter(idx => results[idx] === 'good').length;
    const wrongIndices = order.filter(idx => results[idx] === 'bad');
    els.doneSummary.textContent = `총 ${order.length}문장 중 ${good}문장을 잘했어요.` + (wrongIndices.length ? ` 틀린 문장 ${wrongIndices.length}개는 아래에서 다시 연습해보세요.` : '');
    if(wrongIndices.length){
      els.retryWrongBtn.style.display = 'block';
      els.retryWrongBtn.textContent = `틀린 문제만 다시 풀기 (${wrongIndices.length}개)`;
      els.retryWrongBtn.onclick = ()=>{
        order = shuffle(wrongIndices);
        cur = 0;
        els.doneScreen.classList.remove('show');
        els.practiceCard.style.display = 'block';
        saveProgress();
        renderCard();
      };
    } else {
      els.retryWrongBtn.style.display = 'none';
    }
    return;
  }
  els.practiceCard.style.display = 'block';
  els.doneScreen.classList.remove('show');
  const item = SENTENCES[order[cur]];
  els.koText.textContent = item.ko;
  els.enText.textContent = item.en;
  els.tipText.textContent = item.tip;
  els.catLabel.textContent = item.cat;
  els.idxLabel.textContent = `${String(cur+1).padStart(2,'0')} / ${String(order.length).padStart(2,'0')}`;
  els.userInput.value = '';
  if(listening && recognition){
    recognition.onend = null;
    recognition.stop();
    initSpeechRecognition();
    stopListeningUI();
  }
  clearMicError();
  els.liveTranslate.classList.remove('show');
  els.grammarBox.classList.remove('show');
  els.grammarContent.innerHTML = '';
  translateSeq++;
  clearTimeout(translateTimer);
  revealed = false;
  els.answerBox.classList.remove('show');
  els.revealRow.style.display = 'flex';
  els.rateRow.style.display = 'none';
  els.retrySameLink.style.display = 'none';
  buildDots();
}

function reveal(){
  revealed = true;
  els.answerBox.classList.add('show');
  els.revealRow.style.display = 'none';
  els.rateRow.style.display = 'flex';

    checkGrammar(text);
  } else {
    els.grammarBox.classList.remove('show');

}

function retrySameQuestion(){
  els.userInput.value = '';
  if(listening && recognition){
    recognition.onend = null;
    recognition.stop();
    initSpeechRecognition();
    stopListeningUI();
  }
  clearMicError();

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

async function checkGrammar(text){
  els.grammarBox.classList.add('show');
  els.grammarContent.innerHTML = '<div class="g-note">문법을 분석하고 있어요...</div>';
  try{
    const res = await fetch('https://api.languagetool.org/v2/check', {
      method: 'POST',
      headers: {'Content-Type': 'application/x-www-form-urlencoded'},
      body: `text=${encodeURIComponent(text)}&language=en-US&level=picky`
    });
    const data = await res.json();
    await renderGrammarResults(data.matches || [], text);
  }catch(e){
    els.grammarContent.innerHTML = '<div class="g-note">문법 분석을 불러올 수 없어요. 잠시 후 다시 시도해보세요.</div>';
  }
}

async function translateToKorean(text){
  try{
    const res = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=en|ko`);
    const data = await res.json();
    return (data && data.responseData && data.responseData.translatedText) || text;
  }catch(e){
    return text;
  }
}

async function renderGrammarResults(matches, text){
  if(!matches.length){
    els.grammarContent.innerHTML = '<div class="g-good">문법 오류를 찾지 못했어요! 잘하셨어요 👍</div>';
    return;
  }
  const top = matches.slice(0, 5);
  const translatedMsgs = await Promise.all(top.map(m => translateToKorean(m.message)));
  const html = top.map((m, i)=>{
    const start = Math.max(0, m.offset - 15);
    const end = Math.min(text.length, m.offset + m.length + 15);
    const before = escapeHtml(text.slice(start, m.offset));
    const flagged = escapeHtml(text.slice(m.offset, m.offset + m.length));
    const after = escapeHtml(text.slice(m.offset + m.length, end));
    const suggestion = m.replacements && m.replacements.length ? m.replacements[0].value : '';
    return `<div class="g-item">
      <div class="g-excerpt">${before}<u>${flagged}</u>${after}</div>
      <div class="g-msg">${escapeHtml(translatedMsgs[i])}</div>
      ${suggestion ? `<div class="g-fix">→ ${escapeHtml(suggestion)}</div>` : ''}
    </div>`;
  }).join('');
  els.grammarContent.innerHTML = html;
}

function rate(val){
  results[order[cur]] = val;
  saveProgress();
  logPracticeEvent();
  cur++;
  renderCard();
}

function skip(){
  cur++;
  saveProgress();
  renderCard();
}

async function saveProgress(){
  try{
    await window.storage.set(STORAGE_KEY, JSON.stringify({results, cur, order, cats:[...selectedCats]}), false);
  }catch(e){ /* best effort */ }
}

async function loadProgress(){
  try{
    const res = await window.storage.get(STORAGE_KEY, false);
    if(res && res.value){
      const data = JSON.parse(res.value);
      results = data.results || {};
      if(Array.isArray(data.cats) && data.cats.length){
        selectedCats = new Set(data.cats.filter(c=>CATEGORIES.includes(c)));
      }
      if(Array.isArray(data.order) && data.order.length && data.order.every(i=>i>=0 && i<SENTENCES.length)){
        order = data.order;
        cur = data.cur || 0;
      }
    }
  }catch(e){ /* no saved progress */ }
}

// ── GRAMMAR POINT PRACTICE MODE (전치사·접속사·관사·시제·비교급·대명사 등) ──
const WORD_CATEGORIES = [...new Set(WORD_ITEMS.map(w=>w.cat))];
const WORD_STORAGE_KEY = 'ko-en-opic-word-progress';

let wordSelectedCats = new Set();
let wordOrder = [];
let wordCur = 0;
let wordResults = {}; // idx -> 'good' | 'bad'
let wordAnswered = false;

function hideAllScreens(){
  if(listening && recognition){
    recognition.onend = null;
    recognition.stop();
    initSpeechRecognition();
    stopListeningUI();
  }
  els.homeScreen.style.display = 'none';
  els.topicScreen.style.display = 'none';
  els.practiceCard.style.display = 'none';
  els.doneScreen.classList.remove('show');
  els.wordTopicScreen.style.display = 'none';
  els.wordCard.style.display = 'none';
  els.wordDoneScreen.classList.remove('show');
}

els.toWordModeLink.addEventListener('click', ()=>{
  hideAllScreens();
  els.wordTopicScreen.style.display = 'block';
  renderWordChips();
});

els.toSentenceModeLink.addEventListener('click', ()=>{
  showTopicScreen();
});

function renderWordChips(){
  els.wordTopicChips.innerHTML = '';
  const allBtn = document.createElement('div');
  allBtn.className = 'chip all' + (wordSelectedCats.size === WORD_CATEGORIES.length ? ' active' : '');
  allBtn.textContent = '전체';
  allBtn.onclick = () => {
    wordSelectedCats = wordSelectedCats.size === WORD_CATEGORIES.length ? new Set() : new Set(WORD_CATEGORIES);
    renderWordChips();
  };
  els.wordTopicChips.appendChild(allBtn);

  WORD_CATEGORIES.forEach(cat=>{
    const chip = document.createElement('div');
    chip.className = 'chip' + (wordSelectedCats.has(cat) ? ' active' : '');
    chip.textContent = cat;
    chip.onclick = () => {
      if(wordSelectedCats.has(cat)) wordSelectedCats.delete(cat);
      else wordSelectedCats.add(cat);
      renderWordChips();
    };
    els.wordTopicChips.appendChild(chip);
  });

  const count = WORD_ITEMS.filter(w=>wordSelectedCats.has(w.cat)).length;
  els.wordTopicCount.textContent = wordSelectedCats.size ? `(${count}문제)` : '(유형을 선택하세요)';
  els.wordStartBtn.disabled = wordSelectedCats.size === 0;
  els.wordStartBtn.style.opacity = wordSelectedCats.size === 0 ? '.45' : '1';
  els.wordStartBtn.style.cursor = wordSelectedCats.size === 0 ? 'not-allowed' : 'pointer';
}

function startWordPractice(){
  if(wordSelectedCats.size === 0) return;
  wordOrder = shuffle(WORD_ITEMS.map((_,i)=>i).filter(i=>wordSelectedCats.has(WORD_ITEMS[i].cat)));
  wordCur = 0;
  hideAllScreens();
  els.wordCard.style.display = 'block';
  saveWordProgress();
  renderWordCard();
}

els.wordStartBtn.addEventListener('click', startWordPractice);
els.wordChangeTopicBtn.addEventListener('click', ()=>{
  hideAllScreens();
  els.wordTopicScreen.style.display = 'block';
  renderWordChips();
});
els.wordChangeTopicBtn2.addEventListener('click', ()=>{
  hideAllScreens();
  els.wordTopicScreen.style.display = 'block';
  renderWordChips();
});

function buildWordDots(){
  els.wordProgressDots.innerHTML = '';
  wordOrder.forEach((idx,i)=>{
    const d = document.createElement('div');
    d.className = 'dot' + (wordResults[idx]==='good' ? ' done' : wordResults[idx]==='bad' ? ' miss' : '') + (i===wordCur ? ' cur' : '');
    els.wordProgressDots.appendChild(d);
  });
}

function renderWordCard(){
  if(wordCur >= wordOrder.length){
    els.wordCard.style.display = 'none';
    els.wordDoneScreen.classList.add('show');
    const good = wordOrder.filter(idx => wordResults[idx] === 'good').length;
    const wrongIndices = wordOrder.filter(idx => wordResults[idx] === 'bad');
    els.wordDoneSummary.textContent = `총 ${wordOrder.length}문제 중 ${good}문제를 맞혔어요.` + (wrongIndices.length ? ` 틀린 문제 ${wrongIndices.length}개는 아래에서 다시 연습해보세요.` : '');
    if(wrongIndices.length){
      els.wordRetryWrongBtn.style.display = 'block';
      els.wordRetryWrongBtn.textContent = `틀린 문제만 다시 풀기 (${wrongIndices.length}개)`;
      els.wordRetryWrongBtn.onclick = ()=>{
        wordOrder = shuffle(wrongIndices);
        wordCur = 0;
        els.wordDoneScreen.classList.remove('show');
        els.wordCard.style.display = 'block';
        saveWordProgress();
        renderWordCard();
      };
    } else {
      els.wordRetryWrongBtn.style.display = 'none';
    }
    return;
  }

  els.wordCard.style.display = 'block';
  els.wordDoneScreen.classList.remove('show');
  const item = WORD_ITEMS[wordOrder[wordCur]];
  els.wordCatLabel.textContent = item.cat;
  els.wordIdxLabel.textContent = `${String(wordCur+1).padStart(2,'0')} / ${String(wordOrder.length).padStart(2,'0')}`;
  els.wordSentence.textContent = item.prompt;
  els.wordExplain.classList.remove('show');
  els.wordExplain.textContent = '';
  els.wordGoogleAskRow.style.display = 'none';
  els.wordNextRow.style.display = 'none';
  wordAnswered = false;

  els.wordOptions.innerHTML = '';
  item.options.forEach(opt=>{
    const btn = document.createElement('button');
    btn.className = 'word-opt';
    btn.textContent = opt;
    btn.onclick = () => selectWordOption(opt, btn, item);
    els.wordOptions.appendChild(btn);
  });

  buildWordDots();
}

function selectWordOption(opt, btn, item){
  if(wordAnswered) return;
  wordAnswered = true;
  const isCorrect = opt === item.answer;
  wordResults[wordOrder[wordCur]] = isCorrect ? 'good' : 'bad';
  saveWordProgress();
  logPracticeEvent();

  Array.from(els.wordOptions.children).forEach(b=>{
    b.classList.add('disabled');
    if(b.textContent === item.answer) b.classList.add('correct');
    else if(b === btn) b.classList.add('wrong');
  });

  els.wordExplain.textContent = item.tip;
  els.wordExplain.classList.add('show');
  els.wordGoogleAskRow.style.display = 'flex';
  els.wordNextRow.style.display = 'flex';
  buildWordDots();
}

function buildWordGoogleQuery(item){
  return `'${item.answer}' 표현은 언제 사용해?`;
}

els.wordGoogleAskLink.addEventListener('click', (e)=>{
  const item = WORD_ITEMS[wordOrder[wordCur]];
  if(!item){ e.preventDefault(); return; }
  const url = 'https://www.google.com/search?udm=50&q=' + encodeURIComponent(buildWordGoogleQuery(item));
  els.wordGoogleAskLink.href = url;
});

els.wordGoogleAskCopy.addEventListener('click', ()=>{
  const item = WORD_ITEMS[wordOrder[wordCur]];
  if(!item) return;
  copyText(buildWordGoogleQuery(item), els.wordGoogleAskCopy);
});

els.wordNextBtn.addEventListener('click', ()=>{
  wordCur++;
  saveWordProgress();
  renderWordCard();
});

els.wordRestartBtn.addEventListener('click', ()=>{
  startWordPractice();
});

async function saveWordProgress(){
  try{
    await window.storage.set(WORD_STORAGE_KEY, JSON.stringify({results: wordResults, cur: wordCur, order: wordOrder, cats: [...wordSelectedCats]}), false);
  }catch(e){ /* best effort */ }
}

async function loadWordProgress(){
  try{
    const res = await window.storage.get(WORD_STORAGE_KEY, false);
    if(res && res.value){
      const data = JSON.parse(res.value);
      wordResults = data.results || {};
      if(Array.isArray(data.cats) && data.cats.length){
        wordSelectedCats = new Set(data.cats.filter(c=>WORD_CATEGORIES.includes(c)));
      }
    }
  }catch(e){ /* no saved progress */ }
}

// ── HOME DASHBOARD ───────────────────────────────────────────────
const DAILY_LOG_KEY = 'ko-en-opic-daily-log';
const DAY_LABELS = ['일','월','화','수','목','금','토'];
let dailyLog = {};

function todayKey(d = new Date()){
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

async function loadDailyLog(){
  try{
    const res = await window.storage.get(DAILY_LOG_KEY, false);
    if(res && res.value) dailyLog = JSON.parse(res.value) || {};
  }catch(e){ dailyLog = {}; }
}

async function saveDailyLog(){
  try{ await window.storage.set(DAILY_LOG_KEY, JSON.stringify(dailyLog), false); }
  catch(e){ /* best effort */ }
}

function logPracticeEvent(){
  const key = todayKey();
  dailyLog[key] = (dailyLog[key] || 0) + 1;
  saveDailyLog();
}

function computeStreak(){
  let streak = 0;
  const d = new Date();
  if(!dailyLog[todayKey(d)]) d.setDate(d.getDate() - 1);
  while(dailyLog[todayKey(d)]){
    streak++;
    d.setDate(d.getDate() - 1);
  }
  return streak;
}

function last7Days(){
  const days = [];
  const d = new Date();
  for(let i = 6; i >= 0; i--){
    const dd = new Date(d);
    dd.setDate(d.getDate() - i);
    days.push({key: todayKey(dd), label: DAY_LABELS[dd.getDay()], isToday: i === 0});
  }
  return days;
}

function renderHomeDashboard(){
  const days = last7Days();
  const today = dailyLog[days[days.length - 1].key] || 0;
  const week = days.reduce((sum, d) => sum + (dailyLog[d.key] || 0), 0);

  els.homeDate.textContent = new Date().toLocaleDateString('ko-KR', {month:'long', day:'numeric', weekday:'short'});
  els.statToday.textContent = today;
  els.statWeek.textContent = week;
  els.statStreak.textContent = computeStreak();

  const max = Math.max(1, ...days.map(d => dailyLog[d.key] || 0));
  els.homeChart.innerHTML = days.map(d=>{
    const count = dailyLog[d.key] || 0;
    const h = Math.max(3, Math.round((count / max) * 44));
    return `<div class="bar-col">
      <div class="bar${d.isToday ? ' today' : ''}" style="height:${h}px"></div>
      <div class="bar-label">${d.label}</div>
    </div>`;
  }).join('');

  const sentenceResumable = order.length > 0 && cur < order.length;
  els.navSentenceSub.textContent = sentenceResumable
    ? `이어하기 · ${cur}/${order.length}문제 진행 중`
    : `${SENTENCES.length}문장 · ${CATEGORIES.length}개 주제`;

  const wordResumable = wordOrder.length > 0 && wordCur < wordOrder.length;
  els.navWordSub.textContent = wordResumable
    ? `이어하기 · ${wordCur}/${wordOrder.length}문제 진행 중`
    : `${WORD_ITEMS.length}문제 · ${WORD_CATEGORIES.length}개 유형`;
}

function showHomeScreen(){
  hideAllScreens();
  els.homeScreen.style.display = 'flex';
  renderHomeDashboard();
}

els.navSentence.addEventListener('click', ()=>{
  hideAllScreens();
  if(order.length > 0 && cur < order.length){
    els.practiceCard.style.display = 'block';
    renderCard();
  } else {
    els.topicScreen.style.display = 'block';
    renderChips();
  }
});

els.navWord.addEventListener('click', ()=>{
  hideAllScreens();
  if(wordOrder.length > 0 && wordCur < wordOrder.length){
    els.wordCard.style.display = 'block';
    renderWordCard();
  } else {
    els.wordTopicScreen.style.display = 'block';
    renderWordChips();
  }
});

[els.homeFromTopic, els.homeFromWordTopic, els.homeFromPractice, els.homeFromDone, els.homeFromWordCard, els.homeFromWordDone]
  .forEach(el => el && el.addEventListener('click', showHomeScreen));

async function initDashboard(){
  await loadDailyLog();
  await loadWordProgress();
  await loadProgress();
  renderHomeDashboard();
}

initDashboard();

<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>한→영 문장 변환 연습 · IM1</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/buttons.css" />
    <link rel="stylesheet" href="css/dashboard.css" />
    <link rel="stylesheet" href="css/practice.css" />
    <link rel="stylesheet" href="css/grammar.css" />
    <link rel="stylesheet" href="css/opic.css" />
    <link rel="stylesheet" href="css/pattern.css" />
    <link rel="stylesheet" href="css/filler.css" />
    <link rel="stylesheet" href="css/speech-practice.css" />
    <link rel="stylesheet" href="css/vocab-tooltip.css" />
  </head>
  <body>
    <!-- 앱 초기 비동기 템플릿 로딩 스켈레톤 -->
    <div
      id="appInitialLoading"
      style="
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 50vh;
        gap: 12px;
        color: var(--text-muted, #64748b);
        font-family: var(--font-sans, -apple-system, sans-serif);
      "
    >
      <div
        style="
          width: 32px;
          height: 32px;
          border: 3px solid rgba(79, 70, 229, 0.15);
          border-top-color: #4f46e5;
          border-radius: 50%;
          animation: spin 0.8s linear infinite;
        "
      ></div>
      <span style="font-size: 14px; font-weight: 500"
        >OPIc 학습 환경을 준비하는 중...</span
      >
      <style>
        @keyframes spin {
          to {
            transform: rotate(360deg);
          }
        }
      </style>
    </div>

    <!-- 메인 화면 템플릿 주입 컨테이너 슬롯 -->
    <div class="wrap">
      <div id="homeSlot"></div>
      <div id="practiceSlot"></div>
      <div id="grammarSlot"></div>
      <div id="opicSlot"></div>
      <div id="patternSlot"></div>
      <div id="fillerSlot"></div>
      <div id="speechSlot"></div>
    </div>

    <!-- 공통 모달 템플릿 슬롯 -->
    <div id="modalsSlot"></div>

    <!-- 🚀 비동기 템플릿 및 공통 컴포넌트 로더 -->
    <script src="js/template-loader.js?v=7"></script>
  </body>
</html>
